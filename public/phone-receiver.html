<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob:; connect-src 'none'">
<title>Composition latency receiver</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101010;color:#fff;font:12px -apple-system,sans-serif;overflow:hidden}video,#jpeg{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}#hud{position:absolute;left:12px;bottom:12px;right:12px;background:#111c;padding:10px;border-radius:8px;pointer-events:none}button{pointer-events:auto;background:#ee9c54;color:#151515;border:0;border-radius:6px;padding:9px;margin:4px 8px 4px 0}button:disabled{opacity:.4}#numbers{font-variant-numeric:tabular-nums}#status{margin-bottom:4px}small{display:block;color:#ccc;margin-top:4px}
</style>
<video id="video" autoplay muted playsinline hidden></video><img id="jpeg" alt="Virtual camera preview" hidden>
<div id="hud"><div id="status">Set the starting pose to see the virtual shot.</div><div id="numbers"></div><div id="render"></div><button id="test" disabled>Run 20 latency pulses</button><small>Control → decoded frame estimate. Includes return video; excludes motion sensing and physical screen scanout.</small></div>
<script>
(() => {
  const video = document.querySelector('#video'), jpeg = document.querySelector('#jpeg');
  const status = document.querySelector('#status'), numbers = document.querySelector('#numbers'), test = document.querySelector('#test');
  const canvas = document.createElement('canvas'); canvas.width = 216; canvas.height = 24;
  const context = canvas.getContext('2d', { willReadFrequently: true });
  let config, pc, candidates = [], generation = 0, incoming = Promise.resolve(), frameCallback, raf;
  let frames = 0, lastStats = performance.now(), lastFrame = 0, jpegBusy = false;
  let samples = [], timedOut = 0, pending, pulseTimer, nextTimer, running = false;
  let pulseId = Math.floor(Math.random() * 60000) + 1;
  let metrics = { fps: 0, dropped: null, jitterMs: null, rttMs: null, path: 'JPEG / paired WebSocket' };
  const emit = value => window.webkit?.messageHandlers?.receiver?.postMessage(value);
  const percentile = p => samples.length ? [...samples].sort((a,b) => a-b)[Math.max(0, Math.ceil(samples.length*p)-1)].toFixed(1) : '—';
  function report() {
    numbers.textContent = `${config?.mode ?? 'Waiting'} · ${metrics.fps.toFixed(1)} fps · median ${percentile(.5)} ms · p95 ${percentile(.95)} ms · ${samples.length}/20 received · ${timedOut} timed out`;
    if (config) emit({ type: 'diagnostics', version: 1, streamId: config.streamId, ...metrics, samples, timedOut, status: status.textContent.slice(0,240) });
  }
  function cancelTest() { clearTimeout(pulseTimer); clearTimeout(nextTimer); pending = undefined; running = false; }
  function close() {
    generation++; cancelTest(); pc?.close(); pc = undefined; candidates = [];
    if (frameCallback !== undefined && video.cancelVideoFrameCallback) video.cancelVideoFrameCallback(frameCallback);
    cancelAnimationFrame(raf); video.srcObject = null; video.hidden = true; jpeg.hidden = true; jpeg.removeAttribute('src');
    jpegBusy = false; frames = 0; lastFrame = 0; test.disabled = true;
  }
  function detectedFrame(source) {
    frames++; lastFrame = performance.now(); test.disabled = running;
    if (!pending) return;
    // Fixed high-contrast cells survive JPEG and H.264. Header guards against blank frames.
    context.drawImage(source, 8, 8, 216, 24, 0, 0, 216, 24);
    const pixels = context.getImageData(0, 12, 216, 1).data;
    const value = i => pixels[(i*12+6)*4];
    if (value(0) < 190 || value(1) > 65) return;
    let id = 0;
    for (let i = 0; i < 16; i++) { const v = value(i+2); if (v > 65 && v < 190) return; if (v >= 190) id |= 1 << i; }
    if (id !== pending.id) return;
    samples.push(performance.now() - pending.start); pending = undefined; clearTimeout(pulseTimer); report(); nextPulse();
  }
  function watchVideo(token) {
    const frame = () => {
      if (token !== generation) return;
      if (video.readyState >= 2) detectedFrame(video);
      if (video.requestVideoFrameCallback) frameCallback = video.requestVideoFrameCallback(frame);
      else { status.textContent = 'Frame callbacks unavailable; frame rate/latency are approximate.'; raf = requestAnimationFrame(frame); }
    };
    if (video.requestVideoFrameCallback) frameCallback = video.requestVideoFrameCallback(frame); else raf = requestAnimationFrame(frame);
  }
  function nextPulse() {
    if (!running) return;
    if (samples.length + timedOut >= 20) { running = false; test.disabled = false; status.textContent = 'Test complete. Export results from the Mac before switching modes.'; report(); return; }
    nextTimer = setTimeout(() => {
      if (!config || !running) return;
      pulseId = pulseId % 65535 + 1;
      pending = { id: pulseId, start: performance.now() };
      emit({ type: 'pulse', version: 1, streamId: config.streamId, id: pulseId });
      pulseTimer = setTimeout(() => { pending = undefined; timedOut++; report(); nextPulse(); }, 2000);
    }, 180);
  }
  test.onclick = () => {
    if (!config || performance.now() - lastFrame > 1500) return;
    cancelTest(); samples = []; timedOut = 0; running = true; test.disabled = true;
    status.textContent = 'Measuring returned pixels… Keep the Mac tab visible.'; report(); nextPulse();
  };
  async function accept(message) {
    if (message.type === 'render-stats' && message.streamId === config?.streamId) {
      document.querySelector('#render').textContent = `${message.poseHz.toFixed(1)} poses/s · desktop receive → render ${message.receiveToRenderMs?.toFixed(1) ?? '—'} ms · copy ${message.copyMs.toFixed(1)} ms`;
      return;
    }
    if (message.type === 'preview-config') {
      close(); config = message; samples = []; timedOut = 0; lastStats = performance.now();
      metrics = { fps: 0, dropped: null, jitterMs: null, rttMs: null, path: message.mode === 'jpeg' ? 'JPEG / paired WebSocket' : 'ICE pending' };
      status.textContent = message.mode === 'jpeg' ? 'JPEG baseline · 480×270 · 6 fps target' : `WebRTC · 960×540 · ${message.fps} fps target`;
      report();
      if (message.mode !== 'webrtc') { jpeg.hidden = false; return; }
      if (!window.RTCPeerConnection) throw Error('WebRTC is unavailable in this web view.');
      const peer = new RTCPeerConnection({ iceServers: [] }), token = generation; pc = peer;
      peer.onicecandidate = event => {
        if (!event.candidate || token !== generation) return;
        const { candidate, sdpMid, sdpMLineIndex } = event.candidate;
        emit({ type: 'signal', version: 1, streamId: config.streamId, kind: 'candidate', candidate: { candidate, sdpMid, sdpMLineIndex } });
      };
      peer.ontrack = event => {
        if (token !== generation || event.track.kind !== 'video') return;
        video.srcObject = new MediaStream([event.track]); video.hidden = false;
        video.play().catch(() => { status.textContent = 'Tap the video to start playback.'; }); watchVideo(token);
      };
      peer.onconnectionstatechange = () => {
        if (token !== generation) return;
        if (['failed','disconnected'].includes(peer.connectionState)) { cancelTest(); status.textContent = 'Video disconnected. Retry preview on the Mac.'; report(); }
      };
      return;
    }
    if (message.type === 'jpeg') {
      if (config?.mode !== 'jpeg' || jpegBusy) return;
      jpegBusy = true; const image = new Image(), token = generation;
      image.onload = () => {
        if (token !== generation) return;
        jpeg.src = image.src; detectedFrame(image); jpegBusy = false;
      };
      image.onerror = () => { if (token === generation) jpegBusy = false; };
      image.src = `data:image/jpeg;base64,${message.data}`; return;
    }
    if (message.type !== 'signal' || message.streamId !== config?.streamId || !pc) return;
    if (message.kind === 'candidate') {
      if (pc.remoteDescription) await pc.addIceCandidate(message.candidate);
      else if (candidates.length < 64) candidates.push(message.candidate);
    } else if (message.kind === 'offer') {
      const peer = pc, token = generation;
      await peer.setRemoteDescription({ type: 'offer', sdp: message.sdp });
      for (const candidate of candidates.splice(0)) await peer.addIceCandidate(candidate);
      await peer.setLocalDescription(await peer.createAnswer());
      if (token === generation) emit({ type: 'signal', version: 1, streamId: config.streamId, kind: 'answer', sdp: peer.localDescription.sdp });
    }
  }
  video.onclick = () => video.play();
  window.receiver = {
    accept: message => { incoming = incoming.catch(() => {}).then(() => accept(message)).catch(error => { status.textContent = String(error.message).slice(0,240); report(); }); return incoming; },
    close: () => { close(); config = undefined; },
  };
  setInterval(async () => {
    const now = performance.now(), peer = pc, token = generation;
    metrics.fps = Math.min(240, frames * 1000 / (now-lastStats)); frames = 0; lastStats = now;
    test.disabled = running || now - lastFrame > 1500;
    if (peer) {
      try {
        const stats = await peer.getStats(); if (token !== generation) return;
        for (const stat of stats.values()) {
          if (stat.type === 'inbound-rtp' && stat.kind === 'video') {
            metrics.dropped = stat.framesDropped ?? null; metrics.jitterMs = stat.jitter === undefined ? null : stat.jitter * 1000;
          }
          if (stat.type === 'transport' && stat.selectedCandidatePairId) {
            const pair = stats.get(stat.selectedCandidatePairId), local = stats.get(pair.localCandidateId), remote = stats.get(pair.remoteCandidateId);
            metrics.rttMs = pair.currentRoundTripTime === undefined ? null : pair.currentRoundTripTime*1000;
            metrics.path = `${local?.candidateType ?? '?'} ${local?.protocol ?? '?'} ${local?.address ?? '(hidden)'} → ${remote?.address ?? '(hidden)'}`;
          }
        }
      } catch { /* Closing a peer invalidates its outstanding stats request. */ }
    }
    report();
  }, 1000);
  emit({ type: 'receiver-ready' });
})();
</script></html>
